events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        listen [::]:80;
        server_name openwebui;

        # HSTS : force HTTPS pour tout le sous-domaine
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Empêche l'intégration dans une iframe externe
        add_header X-Frame-Options "DENY" always;
        # Empêche le MIME-sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # Contrôle les informations de referrer envoyées
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Restreint l'accès aux fonctionnalités du navigateur
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Content Security Policy
#        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
#        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:" always;
        # Isolation cross-origin
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location / {
            proxy_pass http://openwebui:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name searxng;

        location / {
            proxy_pass http://searxng:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
