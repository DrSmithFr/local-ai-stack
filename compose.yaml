services:

  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    depends_on:
      - openwebui
      - searxng

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    volumes:
      - ./volumes/openwebui:/app/backend/data
      - ./logs/openwebui:/logs/
    environment:
      # General Configuration
      - TZ=Europe/Paris
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # RAG
      - RAG_EMBEDDING_ENGINE=ollama
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Websocket
      - REDIS_URL=redis://redis:6379/0
      - WEBSOCKET_REDIS_URL=redis://redis:6379/1
      - WEBSOCKET_MANAGER=redis
      - ENABLE_WEBSOCKET_SUPPORT=true

      # Request Logging
      - AUDIT_LOG_LEVEL=REQUEST
      - AUDIT_LOGS_FILE_PATH=/logs/audit.log

      # Web search
      - ENABLE_WEB_SEARCH=true
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?format=json&q=<query>

      # Audio Transcript
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://speaches:8000/v1
      - AUDIO_STT_OPENAI_API_KEY=${SPEACHES_API_KEY}
      - AUDIO_STT_MODEL=Systran/faster-whisper-base

      # Optimisation
      - ENABLE_ORJSON=True
    depends_on:
      - postgres
      - redis
      - searxng
      - speaches
      - open-terminal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgvector-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --save 30 1 --appendonly yes --maxclients 10000 --timeout 1800 --maxmemory-policy noeviction
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ./volumes/models:/model_files
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_KEEP_ALIVE=10m
    restart: unless-stopped
    tty: true

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng-settings.xml:/etc/searxng/settings.xml:rw
    environment:
      - TZ=Europe/Paris
      - REDIS_URL=redis://redis:6379/2
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    depends_on:
      - redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  open-terminal:
    image: ghcr.io/open-webui/open-terminal
    container_name: open-terminal
    restart: unless-stopped
    volumes:
      - ./volumes/terminals-open-terminal:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=${TERMINALS_API_KEY}
      - TZ=Europe/Paris
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    restart: unless-stopped
    volumes:
      - ./volumes/speaches-cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      - TZ=Europe/Paris
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

